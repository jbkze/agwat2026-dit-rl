# E2: full factorial ablation around DRL1 (2 x 2 x 2 cells). Action set and decision interval
# stay at the DRL1 values. The cell DRL1 / mask / dense equals DRL1 in E1.
name: e2_ablation
kind: methods
agents: [drl1]
factors:
  observation: [DRL1, KELLY]
  constraint: [mask, clip]
  reward: [dense, terminal]
budgets:
  tunis: [150, 200, 300, 400, 600]
  nebraska: [75, 100, 125]
seeds: 10
