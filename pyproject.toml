[project]
name = "ditrl"
version = "0.2.0"
description = "Experiments for the DIT-RL revision: DRL irrigation scheduling under a hard seasonal water budget"
requires-python = ">=3.10,<3.11"
# Every version is pinned, so that a fresh install reproduces the runs. The container image
# (Dockerfile) pins the rest of the environment.
dependencies = [
    # AquaCrop-OSPy 3.0.8 fork that exposes the leaf-expansion stress coefficient
    "aquacrop @ git+https://github.com/jbkze/aquacrop-waterstress@818b78171ca37f5885b23dd6636f9bed1f9840b8",
    "numpy==1.26.4",
    "pandas==2.2.2",
    "numba==0.60.0",
    "cffi==1.16.0",
    "gymnasium==0.29.1",
    "stable-baselines3==2.3.2",
    "sb3-contrib==2.3.0",
    "torch==2.4.1",          # CPU build; 2.4.0 misses an OpenMP DLL on Windows
    "pymoo==0.6.1.3",
    "pyyaml==6.0.3",
    "matplotlib==3.10.9",
    "scipy==1.15.3",
    "setuptools==84.0.0",    # numba.pycc imports it at runtime (AquaCrop imports numba.pycc)
]

[project.scripts]
ditrl = "ditrl.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
