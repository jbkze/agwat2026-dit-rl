# Site setups shared by all experiments. Every method (DRL, heuristics, oracle)
# builds its AquaCrop model from these entries, so all methods solve the same problem.

tunis:
  weather: aquacrop:tunis_climate.txt   # weather file shipped with AquaCrop-OSPy
  rain: false                           # rain-free benchmark: precipitation set to 0
  soil: Sand
  crop: Maize
  planting_date: "05/01"
  season_end: "09/11"                   # simulation stops at maturity or at this date
  initial_water_content: {wc_type: Prop, method: Layer, depth_layer: [1], value: [PWP]}
  train_years: [1981, 1996]             # inclusive ranges
  val_years: [1997, 2001]
  test_years: [1980, 1980]
  budgets: [0, 100, 125, 150, 200, 300, 400, 500, 600, 700, 725, 750, 800]

nebraska:
  weather: data/nebraska_weather.csv    # 100-year synthetic series of Kelly et al. (2024)
  rain: true
  soil: SiltClayLoam
  crop: Maize
  planting_date: "05/01"
  season_end: "12/31"
  initial_water_content: {wc_type: Pct, value: [70]}
  train_years: [1995, 2064]             # years 1-70 of the series
  val_years: [2065, 2094]               # as in the paper and Kelly et al.: test years also select the model
  test_years: [2065, 2094]              # years 71-100
  budgets: [75, 100, 125]

# Prices for the ex post profit (Kelly et al. 2024). Used by E7 and by the DRL2 reward in Nebraska.
prices:
  crop_usd_per_t: 180.0
  irrigation_usd_per_mm: 1.0
  fixed_usd_per_ha: 1728.0
