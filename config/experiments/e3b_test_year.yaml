# E3: DRL1 trained, selected and tested on the same single year (year-specific reference,
# Saikai et al. 2023). One job per test year.
name: e3b_test_year
kind: methods
agents: [drl1]
train_on_test_year: true
budgets:
  tunis: [150, 200, 300, 400, 600]
  nebraska: [75, 100, 125]
seeds: {tunis: 10, nebraska: 3}
